<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>1.0.6 duyuru görseli</title>
  <!-- Reddit duyurusu için 1.0.6 görseli (1200x675). ?lang=tr | en -->
  <style>
    html, body { margin: 0; background: #0c0d11; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; overflow: hidden; }

    .canvas {
      position: relative; box-sizing: border-box; width: 1200px; height: 675px;
      padding: 34px 44px 30px; display: flex; flex-direction: column; overflow: hidden;
      background:
        radial-gradient(900px 520px at 88% 8%, rgba(244, 117, 33, .22), transparent 60%),
        radial-gradient(700px 500px at 6% 100%, rgba(91, 59, 110, .45), transparent 60%),
        linear-gradient(135deg, #16171d, #0c0d11);
    }

    /* Başlık */
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .ver {
      font: 800 15px/1 "Segoe UI", sans-serif; letter-spacing: .16em; text-transform: uppercase;
      color: #0c0d11; background: #f47521; padding: 7px 11px;
    }
    .kicker {
      font: 700 13px/1 "Segoe UI", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #8b90a0;
    }
    h1 { font-size: 34px; line-height: 1.12; margin: 12px 0 6px; letter-spacing: -.015em; max-width: 1000px; }
    h1 em { font-style: normal; color: #f47521; }
    p.lede { margin: 0 0 20px; font-size: 16px; line-height: 1.45; color: #c9ccd4; max-width: 980px; }

    /* Önce / sonra */
    .pair { display: flex; gap: 22px; align-items: stretch; }
    .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .label {
      display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
      font: 800 12px/1 "Segoe UI", sans-serif; letter-spacing: .16em; text-transform: uppercase;
    }
    .dot { width: 9px; height: 9px; }
    .before .dot { background: #e0556b; }
    .after .dot { background: #46c47c; }
    .before .label { color: #e0556b; }
    .after .label { color: #46c47c; }

    .stage {
      position: relative; width: 100%; height: 336px; overflow: hidden;
      background: linear-gradient(180deg, #141a3a 0%, #5b3b6e 62%, #e8906a 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .09);
    }
    .after .stage { box-shadow: 0 0 0 2px #46c47c; }
    .moon { position: absolute; left: 64px; top: 30px; width: 54px; height: 54px; border-radius: 50%; background: #ffe9b0; }
    .hill { position: absolute; left: -10%; width: 120%; border-radius: 50% 50% 0 0; }
    .hill.back { bottom: -90px; height: 250px; background: #2a2140; }
    .hill.front { bottom: -140px; left: -35%; width: 120%; height: 278px; background: #17122a; }

    .cap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 18px; text-align: center; }
    .cap.top { top: 14px; }
    .cap.bottom { bottom: 16px; }
    .cap span {
      display: inline-block; font-weight: 700; line-height: 1.24; color: #fff;
      padding: .06em .32em; background: rgba(0, 0, 0, .42);
      text-shadow: 0 0 .08em #000, .05em .05em .06em #000, -.05em -.05em .06em #000;
    }
    .cap.bottom span { font-size: 17px; }
    .cap.top span { font-size: 13px; }
    .cap .sec { color: #ffd84d; }
    .empty {
      position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
      font: 600 14px/1 "Segoe UI", sans-serif; color: rgba(255, 255, 255, .5);
      border: 1px dashed rgba(255, 255, 255, .34); padding: 9px 16px;
    }
    .note { margin: 10px 2px 0; font-size: 14.5px; line-height: 1.38; color: #aab0bd; }
    .note b { color: #e7e9ee; font-weight: 600; }

    /* Alt şerit */
    .chips { display: flex; gap: 10px; margin-top: auto; padding-top: 22px; }
    .chip {
      flex: 1; box-sizing: border-box; padding: 13px 15px;
      background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09);
    }
    .chip .t { font: 700 14.5px/1.2 "Segoe UI", sans-serif; color: #fff; margin-bottom: 4px; }
    .chip .d { font-size: 12.5px; line-height: 1.32; color: #9ea4b3; }
    .plus { color: #f47521; font-weight: 800; }
  </style>
</head>
<body>
<div class="canvas" id="canvas"></div>

<script>
  const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'tr';

  const COPY = {
    tr: {
      kicker: 'Güncelleme',
      title: 'Dublajlı bölümlerde <em>konuşmalar</em> artık görünüyor',
      lede: 'İngilizce dublajla izlerken eklenti yalnızca tabelaları çeviriyordu. En çok bildirilen sorun buydu ve giderildi.',
      before: 'Önce',
      after: 'Sonra',
      signTop: "The Journey's End",
      signTopSec: 'Yolculuğun Sonu',
      emptyMsg: 'konuşma yok',
      lineOrig: 'If we hurry, we can still catch the meteor shower.',
      lineTr: 'Acele edersek hâlâ meteor yağmurunu yakalayabiliriz.',
      noteBefore: '<b>Sadece tabela ve bölüm adı.</b> Karakterler konuşuyor ama ekranda bir şey yok.',
      noteAfter: '<b>Konuşmalar geldi, tabelalar da duruyor.</b> İkisi bir arada.',
      chips: [
        ['6 dilde arayüz', 'İngilizce, Türkçe, Almanca, İspanyolca, Portekizce ve Fransızca. Tarayıcının diline göre açılıyor.'],
        ['Karşılama sayfası', 'Kurulumdan sonra eklentinin çalıştığını ve ayarların nerede olduğunu anlatan tek seferlik bir sayfa.'],
        ['Araç çubuğu adı', 'Simgenin üzerindeki ad da artık arayüz dilini takip ediyor.'],
      ],
    },
    en: {
      kicker: 'Update',
      title: 'Dubbed episodes now show the <em>spoken lines</em>',
      lede: 'Watching with an English dub, the extension translated only the signs. That was the most reported problem, and it is fixed.',
      before: 'Before',
      after: 'After',
      signTop: "The Journey's End",
      signTopSec: 'Yolculuğun Sonu',
      emptyMsg: 'no dialogue',
      lineOrig: 'If we hurry, we can still catch the meteor shower.',
      lineTr: 'Acele edersek hâlâ meteor yağmurunu yakalayabiliriz.',
      noteBefore: '<b>Only signs and the episode title.</b> People are talking, but nothing shows up.',
      noteAfter: '<b>The dialogue is back, and the signs stay.</b> Both at once.',
      chips: [
        ['Interface in 6 languages', 'English, Turkish, German, Spanish, Brazilian Portuguese and French, picked from your browser.'],
        ['Welcome page', 'A one-time page after installing that says the extension already works and where the settings are.'],
        ['Toolbar name', 'The name on the toolbar button follows the interface language too.'],
      ],
    },
  }[LANG];

  document.documentElement.lang = LANG;

  const scene = (inner) => `
    <div class="stage">
      <div class="moon"></div>
      <div class="hill back"></div>
      <div class="hill front"></div>
      <div class="cap top"><span>${COPY.signTop}</span><span class="sec">${COPY.signTopSec}</span></div>
      ${inner}
    </div>`;

  document.getElementById('canvas').innerHTML = `
    <div class="head">
      <span class="ver">1.0.6</span>
      <span class="kicker">${COPY.kicker}</span>
    </div>
    <h1>${COPY.title}</h1>
    <p class="lede">${COPY.lede}</p>

    <div class="pair">
      <div class="col before">
        <div class="label"><i class="dot"></i>${COPY.before}</div>
        ${scene(`<div class="empty">${COPY.emptyMsg}</div>`)}
        <p class="note">${COPY.noteBefore}</p>
      </div>
      <div class="col after">
        <div class="label"><i class="dot"></i>${COPY.after}</div>
        ${scene(`<div class="cap bottom"><span>${COPY.lineOrig}</span><span class="sec">${COPY.lineTr}</span></div>`)}
        <p class="note">${COPY.noteAfter}</p>
      </div>
    </div>

    <div class="chips">
      ${COPY.chips.map(([t, d]) => `<div class="chip"><div class="t"><span class="plus">+</span> ${t}</div><div class="d">${d}</div></div>`).join('')}
    </div>`;
</script>
</body>
</html>
