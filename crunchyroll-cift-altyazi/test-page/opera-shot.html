<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Opera mağaza görseli</title>
  <!-- Opera Eklentileri görselleri: ekran görüntüleri 612x408 ve beyaz zemin,
       tanıtım görseli 300x188. Anlatım iki dilde: solda İngilizce, sağda Türkçe.
       ?view=altyazi | tabela | menu | servisler | tanitim -->
  <style>
    html, body { margin: 0; background: #fff; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: #1d1f24; overflow: hidden; }
    .canvas { width: 612px; height: 408px; box-sizing: border-box; background: #fff; overflow: hidden; }
    em { font-style: normal; color: #f47521; }

    /* İki dilli anlatım satırı */
    .flagrow { display: flex; gap: 16px; }
    .flagrow > div { flex: 1; min-width: 0; }
    .tag {
      display: inline-block; font: 700 9px/1 "Segoe UI", sans-serif; letter-spacing: .12em;
      text-transform: uppercase; color: #fff; background: #f47521; padding: 3px 6px; margin-bottom: 5px;
    }
    .tag.tr { background: #1d1f24; }
    h1 { margin: 0; font-size: 15px; line-height: 1.22; letter-spacing: -.01em; }
    .sub { margin: 4px 0 0; font-size: 11px; line-height: 1.35; color: #5d6270; }

    /* ---- Video görselleri ---- */
    .scene-view { padding: 16px 20px; }
    .stage {
      position: relative; margin-bottom: 13px; width: 572px; height: 250px; overflow: hidden;
      background: linear-gradient(180deg, #141a3a 0%, #5b3b6e 62%, #e8906a 100%);
      box-shadow: 0 8px 20px rgba(20, 22, 40, .18), 0 0 0 1px rgba(20, 22, 40, .10);
    }
    .moon { position: absolute; left: 96px; top: 38px; width: 50px; height: 50px; border-radius: 50%; background: #ffe9b0; }
    .hill { position: absolute; left: -10%; width: 120%; border-radius: 50% 50% 0 0; }
    .hill.back { bottom: -70px; height: 185px; background: #2a2140; }
    .hill.front { bottom: -110px; left: -35%; width: 120%; height: 205px; background: #17122a; }
    .lines {
      position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column;
      align-items: center; gap: 3px; text-align: center; padding: 0 20px;
    }
    .lines span {
      display: inline-block; font-weight: 700; font-size: 18px; line-height: 1.25; color: #fff;
      padding: .05em .34em; border-radius: .2em; background: rgba(0, 0, 0, .38);
      text-shadow: 0 0 .08em #000, .05em .05em .06em #000, -.05em -.05em .06em #000;
    }
    .lines .sec { color: #ffd84d; }
    .lines .hot { color: #4dd2ff; }
    .sign { bottom: auto; top: 12px; }
    .sign span { font-size: 13px; }

    /* ---- Menü görselleri ---- */
    .menu-view { padding: 14px 20px 0; }
    .menu-view .flagrow { margin-bottom: 10px; }
    .stack { width: 404px; margin: 0 auto; overflow: hidden;
             box-shadow: 0 10px 26px rgba(20, 22, 40, .22), 0 0 0 1px rgba(20, 22, 40, .10); }
    .bar { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; background: #f2f3f6; border-bottom: 1px solid #e3e5ea; }
    .bar .url { flex: 1; height: 17px; background: #fff; border: 1px solid #e3e5ea;
                font: 10px/17px "Segoe UI", sans-serif; color: #8b9098; text-align: left; padding: 0 8px; }
    .bar img { display: block; box-shadow: 0 0 0 2px rgba(244, 117, 33, .35); }
    .frame { width: 404px; height: 270px; background: #0f1013; overflow: hidden; }
    .frame iframe { width: 404px; height: 704px; border: 0; display: block; }

    /* ---- Tanıtım görseli (300x188) ---- */
    .promo {
      width: 300px; height: 188px; padding: 15px 16px; display: flex; flex-direction: column; justify-content: space-between;
      background:
        radial-gradient(240px 150px at 88% 8%, rgba(244, 117, 33, .26), transparent 62%),
        linear-gradient(135deg, #16171d, #0c0d11);
    }
    .promo .brand { display: flex; align-items: center; gap: 10px; }
    .promo h2 { margin: 0; font-size: 16px; line-height: 1.12; color: #fff; letter-spacing: -.01em; }
    .promo p { margin: 8px 0 0; font-size: 11px; line-height: 1.35; color: #c9ccd4; }
    .promo .demo {
      height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      gap: 2px; padding-bottom: 7px; text-align: center;
      background: linear-gradient(180deg, #141a3a 0%, #5b3b6e 62%, #e8906a 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
    }
    .promo .demo span {
      display: inline-block; font-weight: 700; font-size: 10px; line-height: 1.3; color: #fff;
      padding: .05em .35em; border-radius: .2em; background: rgba(0, 0, 0, .38);
      text-shadow: 0 0 .08em #000, .05em .05em .06em #000, -.05em -.05em .06em #000;
    }
    .promo .demo .sec { color: #ffd84d; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      const view = new URLSearchParams(location.search).get('view') || 'altyazi';
      const root = document.getElementById('root');
      const scene = '<div class="moon"></div><div class="hill back"></div><div class="hill front"></div>';

      const head = (lang, text) => `
        <div>
          <span class="tag${lang === 'tr' ? ' tr' : ''}">${lang === 'tr' ? 'Türkçe' : 'English'}</span>
          <h1>${text.title}</h1>
          <p class="sub">${text.sub}</p>
        </div>`;

      const scenes = {
        altyazi: {
          body: `<div class="lines">
                   <span class="sec">Acele edersek hâlâ meteor <b class="hot">yağmurunu</b> yakalayabiliriz.</span>
                   <span>…we can still catch the meteor <b class="hot">shower</b>.</span>
                 </div>`,
          en: { title: 'Both languages, <em>one screen</em>', sub: 'Hover a word to see what it means and which word carries it.' },
          tr: { title: 'İki dil, <em>tek ekranda</em>', sub: 'Kelimenin üzerine gel: anlamı ve çevirideki karşılığı.' },
        },
        tabela: {
          body: `<div class="lines sign">
                   <span class="sec">Bölüm 12 — Dönüş Yolu</span>
                   <span>Episode 12: The Way Back</span>
                 </div>
                 <div class="lines">
                   <span class="sec">Bu mektubu sana bıraktı.</span>
                   <span>She left this letter for you.</span>
                 </div>`,
          en: { title: 'Signs and on-screen text <em>too</em>', sub: 'Episode titles and signs are translated above, smaller.' },
          tr: { title: 'Tabela ve ekran yazıları <em>da</em>', sub: 'Bölüm başlığı ve tabelalar üstte, küçük puntoyla.' },
        },
      };

      const menus = {
        menu: {
          src: 'popup-preview.html?s=done&p=google&lang=en&tab=diller',
          en: { title: 'The menu speaks <em>your language</em>', sub: 'English or Turkish, from your browser.' },
          tr: { title: 'Menü <em>senin dilinde</em>', sub: 'İngilizce ya da Türkçe, tarayıcına göre.' },
        },
        servisler: {
          src: 'popup-preview.html?s=done&p=gemini&lang=en&tab=servis',

          en: { title: 'Pick the <em>translation service</em>', sub: 'Google, DeepL, Gemini or Claude.' },
          tr: { title: '<em>Çeviri servisini</em> seç', sub: 'Google, DeepL, Gemini ya da Claude.' },
        },
      };

      if (view === 'tanitim') {
        root.innerHTML = `
          <div class="canvas promo">
            <div>
              <div class="brand">
                <img src="../icons/icon128.png" width="38" height="38" alt="">
                <h2>Dual Subtitles<br>for Crunchyroll</h2>
              </div>
              <p>The original subtitle and its translation, <em>at the same time</em>.</p>
            </div>
            <div class="demo">
              <span class="sec">Geri gelip gelmeyeceğini bilmiyorum.</span>
              <span>I don't know if he will come back.</span>
            </div>
          </div>`;
      } else if (scenes[view]) {
        const s = scenes[view];
        root.innerHTML = `
          <div class="canvas scene-view">
            <div class="stage">${scene}${s.body}</div>
            <div class="flagrow">${head('en', s.en)}${head('tr', s.tr)}</div>
          </div>`;
      } else if (menus[view]) {
        const m = menus[view];
        root.innerHTML = `
          <div class="canvas menu-view">
            <div class="flagrow">${head('en', m.en)}${head('tr', m.tr)}</div>
            <div class="stack">
              <div class="bar">
                <div class="url">crunchyroll.com/watch/…</div>
                <img src="../icons/icon32.png" width="20" height="20" alt="">
              </div>
              <div class="frame"><iframe src="${m.src}" title="Menu"></iframe></div>
            </div>
          </div>`;
        const frame = root.querySelector('iframe');
        const timer = setInterval(() => {
          const doc = frame.contentDocument;
          if (!doc || !doc.querySelector('.card')) return;
          // Kırpılan görüntüde kaydırma çubuğu görünmesin
          const style = doc.createElement('style');
          style.textContent = 'html { scrollbar-width: none } ::-webkit-scrollbar { display: none }';
          doc.head.append(style);
          clearInterval(timer);
        }, 100);
      }
    })();
  </script>
</body>
</html>
