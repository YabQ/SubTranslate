<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Çift Altyazı — deneme sayfası</title>
  <link rel="stylesheet" href="../src/content/page.css">
  <style>
    body { margin: 0; padding: 20px; background: #0f1013; color: #e8e8ea; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.lead { margin: 0 0 16px; color: #9a9ea8; }
    .layout { display: grid; grid-template-columns: 960px minmax(260px, 1fr); gap: 20px; align-items: start; }
    .bitmovinplayer-container { width: 960px; height: 540px; background: #000; overflow: hidden; }
    .bitmovinplayer-container.tall { height: 640px; }
    .bitmovinplayer-container video { width: 100%; height: 100%; display: block; }
    .bmpui-ui-uicontainer { position: absolute; inset: 0; pointer-events: none; }
    .fake-controlbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 20px;
      display: flex; align-items: center; gap: 12px; color: #fff; font-weight: 600;
      background: linear-gradient(transparent, rgba(0,0,0,.85)); opacity: 0; transition: opacity .2s;
    }
    .fake-controlbar .track { flex: 1; height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; }
    .fake-controlbar .track::before { content: ""; display: block; width: 35%; height: 100%; background: #f47521; border-radius: 2px; }
    .bmpui-controls-shown .fake-controlbar { opacity: 1; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    button, select { background: #23262d; color: #e8e8ea; border: 1px solid #2d3038; border-radius: 7px; padding: 6px 10px; font: inherit; cursor: pointer; }
    button:hover { border-color: #f47521; }
    #seek { flex: 1; accent-color: #f47521; }
    #time { font-variant-numeric: tabular-nums; color: #9a9ea8; }
    .panel { background: #1a1c21; border: 1px solid #2d3038; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .panel h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9a9ea8; }
    #status { margin: 0; max-height: 360px; overflow: auto; font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; }
    #log { max-height: 200px; overflow: auto; font: 12px/1.5 Consolas, monospace; color: #b8bcc6; }

    /* Mağaza ekran görüntüsü modu (?shot): yalnızca 1280x800 oynatıcı */
    body.shot { padding: 0; overflow: hidden; }
    body.shot h1, body.shot .lead, body.shot .bar, body.shot .layout > div:last-child { display: none; }
    body.shot .layout { display: block; }
    body.shot .bitmovinplayer-container { width: 1280px; height: 800px; }
    .shot-caption {
      position: absolute; left: 36px; top: 32px; z-index: 5; max-width: 36%;
      padding: 12px 18px; border-radius: 12px; border-left: 4px solid #f47521;
      background: rgba(12, 13, 17, .78); color: #fff; font: 700 26px/1.3 "Segoe UI", system-ui, sans-serif;
    }
    .shot-caption small { display: block; margin-top: 4px; font-size: 16px; font-weight: 500; color: #c9ccd4; }
    .shot-caption.bottom { top: auto; bottom: 32px; }
  </style>
</head>
<body>
  <h1>Çift Altyazı — deneme sayfası</h1>
  <p class="lead">Eklentinin gerçek kanca ve içerik betikleri sahte bir Bitmovin oynatıcısında çalışır. Altyazı: <code>tests/fixtures/sample.ass</code>.</p>

  <div class="layout">
    <div>
      <div class="bitmovinplayer-container" id="player">
        <video id="video" muted playsinline></video>
        <div class="bmpui-ui-uicontainer bmpui-controls-hidden" id="ui">
          <div class="fake-controlbar"><span>▶</span><div class="track"></div><span>⚙ ⛶</span></div>
        </div>
      </div>
      <div class="bar">
        <button id="play">▶ Oynat</button>
        <input type="range" id="seek" min="0" step="0.1" value="0">
        <span id="time">00:00.0</span>
      </div>
      <div class="bar">
        <button data-toggle="translationOnTop">Çeviri üstte ⇅</button>
        <button data-toggle="showOriginal">Orijinal</button>
        <button data-toggle="showTranslation">Çeviri</button>
        <button data-toggle="showSigns">Tabelalar</button>
        <button data-scale="0.15">A+</button>
        <button data-scale="-0.15">A−</button>
        <button id="controls">Kontrolleri göster/gizle</button>
        <button id="aspect">Kapsayıcı oranı</button>
        <button id="fullscreen">Tam ekran</button>
      </div>
      <div class="bar">
        <label>Çeviri servisi
          <select id="provider">
            <option value="real">Gerçek (Google)</option>
            <option value="fake">Sahte ([TR] öneki)</option>
          </select>
        </label>
        <label>Hedef dil
          <select id="target">
            <option value="tr">Türkçe</option>
            <option value="es">İspanyolca (resmi altyazı)</option>
            <option value="de">Almanca</option>
          </select>
        </label>
      </div>
    </div>
    <div>
      <div class="panel"><h2>Günlük</h2><div id="log"></div></div>
      <div class="panel"><h2>İçerik betiği durumu</h2><pre id="status">—</pre></div>
    </div>
  </div>

  <script src="harness.js"></script>
  <script src="../src/page/hook.js"></script>
  <script src="../src/shared/languages.js"></script>
  <script src="../src/shared/settings.js"></script>
  <script src="../src/shared/vocab.js"></script>
  <script src="../src/content/subtitles.js"></script>
  <script src="../src/shared/words.js"></script>
  <script src="../src/content/overlay.js"></script>
  <script src="../src/content/content.js"></script>
  <script src="player.js"></script>
</body>
</html>
